    <script>
      (function() {
        // Suppress external browser extension and third-party Web3/MetaMask/WebSocket noise
        var isExtensionOrWsError = function(msg, src) {
          var text = (String(msg || '') + ' ' + String(src || '')).toLowerCase();
          return (
            text.indexOf('metamask') !== -1 ||
            text.indexOf('ethereum') !== -1 ||
            text.indexOf('t is not a function') !== -1 ||
            text.indexOf('only a getter') !== -1 ||
            text.indexOf('websocket') !== -1 ||
            text.indexOf('failed to connect to websocket') !== -1 ||
            text.indexOf('chrome-extension') !== -1 ||
            text.indexOf('moz-extension') !== -1 ||
            text.indexOf('inpage.js') !== -1 ||
            text.indexOf('contentscript') !== -1
          );
        };

        var origOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (isExtensionOrWsError(message, source) || (error && isExtensionOrWsError(error.message, error.stack))) {
            return true; // suppresses error
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          var msg = event ? (event.message || '') : '';
          var src = event ? (event.filename || '') : '';
          if (isExtensionOrWsError(msg, src)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason ? (event.reason.message || event.reason.stack || String(event.reason)) : '';
          if (isExtensionOrWsError(reason, '')) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopPropagation) event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
